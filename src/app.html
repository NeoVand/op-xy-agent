<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#0f0e12" />
		<script>
			// Apply the saved theme before first paint, so there is no flash of the wrong one.
			// The key must match THEME_STORAGE_KEY in src/lib/ui/theme.svelte.ts.
			try {
				var saved = localStorage.getItem('opxy:theme');
				if (saved === 'light' || saved === 'dark') {
					document.documentElement.dataset.theme = saved;
					if (saved === 'light') {
						document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f5f5');
					}
				}
				// The manual's sidebar, folded to icons or not (key: FOLD_KEY in routes/manual/+layout).
				if (localStorage.getItem('opxy:manual-sidebar') === 'collapsed') {
					document.documentElement.dataset.manualSidebar = 'collapsed';
				}
			} catch (e) {
				// Storage blocked: stay on the default (dark) theme.
			}
			// A phone gets a preview and a note instead of the app, which needs a computer (PhoneNote,
			// read by the root layout). A phone is a touch screen with no hover whose short side is
			// under 600 px: tablets, and laptops with touch screens, keep the app.
			if (
				matchMedia('(hover: none) and (pointer: coarse)').matches &&
				Math.min(screen.width, screen.height) < 600
			) {
				document.documentElement.dataset.device = 'phone';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
